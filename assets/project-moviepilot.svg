<svg xmlns="http://www.w3.org/2000/svg" width="440" height="252" viewBox="0 0 440 252" role="img" aria-labelledby="title desc">
  <title id="title">MoviePilot-Plugins · 近期活跃项目</title>
  <desc id="desc">兼容 MoviePilot V2/V3 的 MetaTube 媒体整理插件。支持目录浏览、元数据刮削与本地 STRM 映射。</desc>
  <rect x="0.5" y="0.5" width="439" height="251" rx="12" fill="#1a2018" stroke="#343d2e"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="25" y="35" font-size="11" letter-spacing="1.8" fill="#a7b29f">02 / MEDIA AUTOMATION</text>
    <circle cx="342" cy="31" r="3" fill="#c7f08a"/>
    <text x="354" y="35" font-size="11" fill="#c7f08a">近期活跃</text>
    <text x="25" y="83" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#edf1e7">MoviePilot-Plugins</text>
    <text x="25" y="117" font-size="15" fill="#a7b29f">面向 MoviePilot 的媒体整理插件。</text>
    <text x="25" y="143" font-size="15" fill="#a7b29f">目录浏览、元数据刮削与 STRM 映射。</text>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#c7f08a">
      <text x="25" y="179">Python</text><text x="82" y="179" fill="#69765e">/</text><text x="100" y="179">MoviePilot V2 + V3</text>
    </g>
    <path d="M25 200H415" stroke="#343d2e"/>
    <text x="25" y="229" font-size="12" fill="#a7b29f">把重复整理，交给自动化</text>
    <text x="410" y="230" text-anchor="end" font-size="21" fill="#c7f08a">↗</text>
  </g>
</svg>
