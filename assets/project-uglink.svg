    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" fill="#c7f08a">
      <text x="25" y="179">TypeScript</text><text x="111" y="179" fill="#69765e">/</text><text x="129" y="179">Cloudflare Workers</text>
    </g>
    <path d="M25 200H415" stroke="#343d2e"/>
    <text x="25" y="229" font-size="12" fill="#a7b29f">让远程访问更可靠</text>
    <text x="410" y="230" text-anchor="end" font-size="21" fill="#c7f08a">↗</text>
  </g>
